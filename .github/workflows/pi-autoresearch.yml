name: Pi autoresearch

# Reusable workflow that runs pi-autoresearch (https://github.com/davebcn87/pi-autoresearch)
# inside Pi (https://pi.dev), driven via Pi's RPC mode. The pi-autoresearch
# extension owns the iteration loop; we just install the pieces, kick it off
# with a goal, wait for the cap, push the experiment branch, and open a PR.
#
# Architecture:
#   setup → run-loop (pi RPC driver) → open-pr → finish
#
# Consumers:
#   jobs:
#     autoresearch:
#       uses: dylan-murray/pi-autoresearch-action/.github/workflows/pi-autoresearch.yml@main
#       secrets: inherit
#       with:
#         pi-provider: 'ollama'
#         pi-model: 'gpt-oss:120b-cloud'
#         goal: 'Reduce TODO count in fixtures/, keep python parsing.'
#         max-iterations: '10'

on:
  workflow_call:
    inputs:
      pi-provider:
        type: string
        required: true
        description: 'Pi provider id (ollama | anthropic | openai). Determines which secret pi expects.'
      pi-model:
        type: string
        required: true
        description: 'Pi model id (e.g. gpt-oss:120b-cloud, anthropic/claude-sonnet-4-6).'
      goal:
        type: string
        required: true
        description: 'Goal description fed to /skill:autoresearch-create. Include the metric command, files in scope, and any constraints.'
      max-iterations:
        type: string
        default: '10'
        description: 'maxIterations cap written to autoresearch.config.json. pi-autoresearch self-stops at this number.'
      timeout-minutes:
        type: string
        default: '60'
        description: 'Wall-clock backstop for the pi RPC driver. If max-iterations is high or the benchmark is slow, raise this.'
      pi-autoresearch-ref:
        type: string
        default: 'https://github.com/davebcn87/pi-autoresearch'
        description: 'Git URL or ref of the pi-autoresearch extension. Pin to a commit if you want reproducibility.'
      git-user-name:
        type: string
        default: 'autoresearch-bot'
      git-user-email:
        type: string
        default: 'autoresearch-bot@users.noreply.github.com'
    # No declared secrets — consumers use `secrets: inherit` and set one of:
    #   OLLAMA_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY
    # depending on pi-provider.

# Serialize runs against the same caller repo. Two overlapping runs would
# clobber the experiment branch.
concurrency:
  group: pi-autoresearch-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ============================================================================
  # Stage 0: setup — derive run id, prep experiment branch
  # ============================================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.gen.outputs.run-id }}
      branch: ${{ steps.gen.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive run-id and branch
        id: gen
        run: |
          set -e
          RUN_ID="$(date -u +%Y%m%d-%H%M%S)-$(openssl rand -hex 3)"
          BRANCH="autoresearch/exp/${RUN_ID}"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID branch=$BRANCH"

  # ============================================================================
  # Stage 1: run-loop — install pi + extension + ollama, drive RPC, push branch
  # ============================================================================
  run-loop:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.timeout-minutes) }}
    outputs:
      kept-commits: ${{ steps.harvest.outputs.kept-commits }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: ./
        id: setup-action
        with:
          pi-provider: ${{ inputs.pi-provider }}
          pi-model: ${{ inputs.pi-model }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          pi-autoresearch-ref: ${{ inputs.pi-autoresearch-ref }}
          git-user-name: ${{ inputs.git-user-name }}
          git-user-email: ${{ inputs.git-user-email }}

      - name: Create experiment branch
        env:
          BRANCH: ${{ needs.setup.outputs.branch }}
        run: |
          set -e
          git fetch origin main
          git branch "$BRANCH" origin/main
          git push -u origin "$BRANCH"
          git checkout "$BRANCH"
          echo "Checked out $BRANCH"

      - name: Write autoresearch.config.json
        env:
          MAX_ITER: ${{ inputs.max-iterations }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os
          cfg = {"maxIterations": int(os.environ["MAX_ITER"])}
          with open("autoresearch.config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          print(f"Wrote autoresearch.config.json: {cfg}")
          PY

      - name: Run pi-autoresearch via RPC driver
        env:
          PI_PROVIDER: ${{ inputs.pi-provider }}
          PI_MODEL: ${{ inputs.pi-model }}
          GOAL_TEXT: ${{ inputs.goal }}
          # Driver's wall-clock backstop = (job timeout - 5 min margin)
          TIMEOUT_SECONDS: ${{ fromJson(inputs.timeout-minutes) * 60 - 300 }}
          EVENT_LOG: pi-events.jsonl
        run: |
          set -e
          python3 "$HOME/.pi-autoresearch/scripts/pi_rpc_driver.py"

      - name: Harvest results
        id: harvest
        env:
          BRANCH: ${{ needs.setup.outputs.branch }}
        run: |
          set -e
          git push origin "$BRANCH"
          KEPT=$(git rev-list --count "origin/main..$BRANCH")
          echo "kept-commits=$KEPT" >> "$GITHUB_OUTPUT"
          echo "kept commits on $BRANCH: $KEPT"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: pi-run-${{ needs.setup.outputs.run-id }}
          path: |
            pi-events.jsonl
            autoresearch.md
            autoresearch.jsonl
            autoresearch.config.json
            autoresearch.sh
            autoresearch.checks.sh
          if-no-files-found: warn

  # ============================================================================
  # Stage 2: open-pr — open one PR if the loop produced kept commits
  # ============================================================================
  open-pr:
    needs: [setup, run-loop]
    runs-on: ubuntu-latest
    if: needs.run-loop.outputs.kept-commits != '0'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with:
          name: pi-run-${{ needs.setup.outputs.run-id }}
          path: ./_pi-run/

      - name: Open PR
        env:
          BRANCH: ${{ needs.setup.outputs.branch }}
          GOAL: ${{ inputs.goal }}
          PROVIDER: ${{ inputs.pi-provider }}
          MODEL: ${{ inputs.pi-model }}
          MAX_ITER: ${{ inputs.max-iterations }}
          KEPT: ${{ needs.run-loop.outputs.kept-commits }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BODY_FILE=$(mktemp)
          {
            echo "## Autoresearch experiment"
            echo
            echo "**Goal:** $GOAL"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Provider | \`$PROVIDER\` |"
            echo "| Model | \`$MODEL\` |"
            echo "| Max iterations | $MAX_ITER |"
            echo "| Kept commits | $KEPT |"
            echo
            echo "### Session"
            echo
            if [ -f ./_pi-run/autoresearch.md ]; then
              echo '<details><summary>autoresearch.md</summary>'
              echo
              echo '```markdown'
              cat ./_pi-run/autoresearch.md
              echo
              echo '```'
              echo '</details>'
            else
              echo "_(no autoresearch.md produced)_"
            fi
            echo
            echo "---"
            echo "*Opened by [\`pi-autoresearch-action\`](https://github.com/dylan-murray/pi-autoresearch-action). Every commit on this branch was generated by an AI agent — review the diff carefully before merging.*"
          } > "$BODY_FILE"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "autoresearch: $GOAL" \
            --label autoresearch \
            --body-file "$BODY_FILE"

  # ============================================================================
  # Stage 3: finish — emit step summary
  # ============================================================================
  finish:
    needs: [setup, run-loop, open-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Step summary
        env:
          RUN_ID: ${{ needs.setup.outputs.run-id }}
          BRANCH: ${{ needs.setup.outputs.branch }}
          KEPT: ${{ needs.run-loop.outputs.kept-commits }}
          LOOP_RESULT: ${{ needs.run-loop.result }}
          PR_RESULT: ${{ needs.open-pr.result }}
        run: |
          {
            echo "# Pi autoresearch — \`$RUN_ID\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Kept commits | $KEPT |"
            echo "| Loop result | \`$LOOP_RESULT\` |"
            echo "| PR result | \`$PR_RESULT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
