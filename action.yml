name: 'Pi autoresearch'
description: 'Run pi-autoresearch (autonomous experiment loop) inside a Pi RPC session, push the experiment branch, and open a PR. Single-step composite — drop into any job.'
author: 'Dylan Murray'
branding:
  icon: 'rotate-ccw'
  color: 'purple'

inputs:
  pi-provider:
    description: 'Pi provider id. Anything Pi supports — ollama, anthropic, openai, google, groq, mistral, openrouter, xai, cerebras, deepseek, etc.'
    required: true
  pi-model:
    description: 'Pi model id (e.g. gpt-oss:120b-cloud, anthropic/claude-sonnet-4-6, openrouter/google/gemini-2.0-flash).'
    required: true
  goal:
    description: 'Goal description fed to /skill:autoresearch-create. Leave empty for auto-goal mode (Pi picks the metric itself).'
    required: false
    default: ''
  focus:
    description: 'Auto-goal only: comma-sep focus areas (e.g. tests,perf,docs).'
    required: false
    default: ''
  ignore:
    description: 'Auto-goal only: comma-sep glob patterns to avoid.'
    required: false
    default: ''
  max-iterations:
    description: 'maxIterations cap written to autoresearch.config.json. pi-autoresearch self-stops at this number.'
    required: false
    default: '10'
  driver-timeout-seconds:
    description: 'Wall-clock backstop for the RPC driver. Should be less than the consuming job''s timeout-minutes (in seconds) to leave room for harvest + PR.'
    required: false
    default: '3300'
  pi-autoresearch-ref:
    description: 'Git URL or ref of the pi-autoresearch extension. Pin to a commit for reproducibility.'
    required: false
    default: 'https://github.com/davebcn87/pi-autoresearch'
  base-branch:
    description: 'Branch to base the experiment branch on, and to open the PR against.'
    required: false
    default: 'main'
  open-pr:
    description: 'Whether to open a PR after the loop. `true` (default) | `false` (just push the experiment branch).'
    required: false
    default: 'true'
  git-user-name:
    required: false
    default: 'autoresearch-bot'
  git-user-email:
    required: false
    default: 'autoresearch-bot@users.noreply.github.com'

outputs:
  run-id:
    description: 'Generated run id (used in step summaries / artifacts).'
    value: ${{ steps.gen.outputs.run-id }}
  branch:
    description: 'Experiment branch name (created by pi-autoresearch as `autoresearch/<goal-slug>-<date>`).'
    value: ${{ steps.harvest.outputs.branch }}
  kept-commits:
    description: 'Number of commits the loop kept on the experiment branch.'
    value: ${{ steps.harvest.outputs.kept-commits }}
  pr-url:
    description: 'PR URL if one was opened, else empty.'
    value: ${{ steps.open-pr.outputs.pr-url }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pi-coding-agent
      shell: bash
      run: |
        set -e
        npm install -g @mariozechner/pi-coding-agent
        pi --version

    - name: Register Ollama Cloud provider in pi (provider=ollama)
      if: inputs.pi-provider == 'ollama'
      shell: bash
      env:
        PI_MODEL: ${{ inputs.pi-model }}
      run: |
        set -e
        if [ -z "${OLLAMA_API_KEY:-}" ]; then
          echo "::error::pi-provider=ollama requires OLLAMA_API_KEY in env (set it on the action step's env: block)."
          exit 1
        fi
        # `ollama launch pi` writes a similar models.json that points pi at the
        # local ollama daemon. We bypass the daemon by pointing pi directly at
        # the cloud's OpenAI-compat endpoint with OLLAMA_API_KEY as the bearer.
        # Avoids `ollama signin` entirely.
        mkdir -p "$HOME/.pi/agent"
        python3 - <<'PY'
        import json, os
        cfg = {
            "providers": {
                "ollama": {
                    "baseUrl": "https://ollama.com/v1",
                    "api": "openai-completions",
                    "apiKey": os.environ["OLLAMA_API_KEY"],
                    "models": [{"id": os.environ["PI_MODEL"]}],
                }
            }
        }
        with open(os.path.expanduser("~/.pi/agent/models.json"), "w") as f:
            json.dump(cfg, f, indent=2)
        # Mirror to stdout WITHOUT the apiKey for log readability
        cfg["providers"]["ollama"]["apiKey"] = "***"
        print(json.dumps(cfg, indent=2))
        PY

    - name: Install pi-autoresearch extension
      shell: bash
      env:
        PI_AUTORESEARCH_REF: ${{ inputs.pi-autoresearch-ref }}
      run: |
        set -e
        pi install "$PI_AUTORESEARCH_REF"
        echo "Installed pi-autoresearch extension."

    - name: Configure git
      shell: bash
      env:
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -e
        git config --global user.name "$GIT_USER_NAME"
        git config --global user.email "$GIT_USER_EMAIL"
        git config --global init.defaultBranch main

    - name: Generate run-id
      id: gen
      shell: bash
      env:
        BASE: ${{ inputs.base-branch }}
      run: |
        set -e
        RUN_ID="$(date -u +%Y%m%d-%H%M%S)-$(openssl rand -hex 3)"
        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "run_id=$RUN_ID"
        # pi-autoresearch's autoresearch-create skill does
        # `git checkout -b autoresearch/<goal>-<date>` itself, so we don't
        # pre-create a branch — we just sit on $BASE and let pi spin its own.
        # Make sure we're on the base branch when it's invoked.
        git fetch origin "$BASE"
        git checkout "$BASE" 2>/dev/null || git checkout -b "$BASE" "origin/$BASE"

    - name: Write autoresearch.config.json
      shell: bash
      env:
        MAX_ITER: ${{ inputs.max-iterations }}
      run: |
        set -e
        python3 - <<'PY'
        import json, os
        cfg = {"maxIterations": int(os.environ["MAX_ITER"])}
        with open("autoresearch.config.json", "w") as f:
            json.dump(cfg, f, indent=2)
        print(f"Wrote autoresearch.config.json: {cfg}")
        PY

    - name: Run pi-autoresearch via RPC driver
      shell: bash
      env:
        PI_PROVIDER: ${{ inputs.pi-provider }}
        PI_MODEL: ${{ inputs.pi-model }}
        GOAL_TEXT: ${{ inputs.goal }}
        AUTO_GOAL_FOCUS: ${{ inputs.focus }}
        AUTO_GOAL_IGNORE: ${{ inputs.ignore }}
        TIMEOUT_SECONDS: ${{ inputs.driver-timeout-seconds }}
        EVENT_LOG: pi-events.jsonl
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -e
        # Provider API keys are inherited from the consumer's `env:` block.
        # Pi reads its provider-specific env var directly (e.g. OLLAMA_API_KEY,
        # ANTHROPIC_API_KEY); we don't enumerate them here.
        python3 "$ACTION_PATH/scripts/pi_rpc_driver.py"

    - name: Harvest results
      id: harvest
      shell: bash
      env:
        BASE: ${{ inputs.base-branch }}
      run: |
        set -e
        # pi-autoresearch's skill ran `git checkout -b autoresearch/<goal>-<date>`
        # itself. Capture whatever branch HEAD is on now — that's pi's branch.
        # If the loop never ran (driver crashed, no commits), HEAD is still on
        # $BASE; we report 0 kept and skip the push.
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        if [ "$BRANCH" = "$BASE" ]; then
          echo "::warning::HEAD is still on $BASE — pi-autoresearch didn't create a branch."
          echo "branch=" >> "$GITHUB_OUTPUT"
          echo "kept-commits=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git push -u origin "$BRANCH"
        KEPT=$(git rev-list --count "origin/$BASE..$BRANCH")
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        echo "kept-commits=$KEPT" >> "$GITHUB_OUTPUT"
        echo "kept $KEPT commits on $BRANCH"

    - name: Open PR
      id: open-pr
      if: inputs.open-pr == 'true' && steps.harvest.outputs.kept-commits != '0'
      shell: bash
      env:
        BRANCH: ${{ steps.harvest.outputs.branch }}
        BASE: ${{ inputs.base-branch }}
        GOAL: ${{ inputs.goal }}
        PROVIDER: ${{ inputs.pi-provider }}
        MODEL: ${{ inputs.pi-model }}
        MAX_ITER: ${{ inputs.max-iterations }}
        KEPT: ${{ steps.harvest.outputs.kept-commits }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        # In auto-goal mode, infer a title from autoresearch.md's first heading.
        if [ -z "$GOAL" ]; then
          if [ -f autoresearch.md ]; then
            GOAL=$(awk '/^# / {sub(/^# */, ""); print; exit}' autoresearch.md)
          fi
          : "${GOAL:=auto-goal experiment}"
          GOAL_LABEL="**Goal (auto-chosen):** $GOAL"
        else
          GOAL_LABEL="**Goal:** $GOAL"
        fi
        TITLE="autoresearch: $GOAL"
        TITLE="${TITLE:0:140}"

        BODY_FILE=$(mktemp)
        {
          echo "## Autoresearch experiment"
          echo
          echo "$GOAL_LABEL"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Provider | \`$PROVIDER\` |"
          echo "| Model | \`$MODEL\` |"
          echo "| Max iterations | $MAX_ITER |"
          echo "| Kept commits | $KEPT |"
          echo
          echo "### Session"
          echo
          if [ -f autoresearch.md ]; then
            echo '<details><summary>autoresearch.md</summary>'
            echo
            echo '```markdown'
            cat autoresearch.md
            echo
            echo '```'
            echo '</details>'
          else
            echo "_(no autoresearch.md produced)_"
          fi
          echo
          echo "---"
          echo "*Opened by [\`pi-autoresearch-action\`](https://github.com/dylan-murray/pi-autoresearch-action). Every commit on this branch was generated by an AI agent — review carefully before merging.*"
        } > "$BODY_FILE"

        # Ensure the `autoresearch` label exists on the consuming repo;
        # `gh pr create --label X` exits non-zero if the label is missing.
        gh label create autoresearch \
          --description "Opened by pi-autoresearch-action" \
          --color "8957e5" 2>/dev/null || true

        URL=$(gh pr create \
          --base "$BASE" \
          --head "$BRANCH" \
          --title "$TITLE" \
          --label autoresearch \
          --body-file "$BODY_FILE")
        echo "pr-url=$URL" >> "$GITHUB_OUTPUT"
        echo "$URL"

    - name: Step summary
      if: always()
      shell: bash
      env:
        RUN_ID: ${{ steps.gen.outputs.run-id }}
        BRANCH: ${{ steps.harvest.outputs.branch }}
        KEPT: ${{ steps.harvest.outputs.kept-commits }}
        PR_URL: ${{ steps.open-pr.outputs.pr-url }}
      run: |
        {
          echo "# Pi autoresearch — \`$RUN_ID\`"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Branch | \`$BRANCH\` |"
          echo "| Kept commits | ${KEPT:-0} |"
          if [ -n "$PR_URL" ]; then
            echo "| PR | $PR_URL |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pi-run-${{ steps.gen.outputs.run-id }}
        path: |
          pi-events.jsonl
          autoresearch.md
          autoresearch.jsonl
          autoresearch.config.json
          autoresearch.sh
          autoresearch.checks.sh
        if-no-files-found: warn
