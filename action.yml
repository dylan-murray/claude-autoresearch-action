name: 'Pi autoresearch — setup'
description: 'Install pi-coding-agent, the pi-autoresearch extension, ollama (if requested), and the RPC driver. Used as a step in pi-autoresearch.yml.'
author: 'Dylan Murray'
branding:
  icon: 'rotate-ccw'
  color: 'purple'

inputs:
  pi-provider:
    description: 'Pi provider id. Anything Pi supports — pi reads its own provider env var, the action just forwards every key it received.'
    required: true
  pi-model:
    description: 'Pi model id (e.g. `gpt-oss:120b-cloud`, `anthropic/claude-sonnet-4-6`).'
    required: true
  ollama-api-key:
    description: 'Ollama Cloud API key.'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key.'
    required: false
    default: ''
  openai-api-key:
    description: 'OpenAI API key.'
    required: false
    default: ''
  google-api-key:
    description: 'Google AI / Gemini API key.'
    required: false
    default: ''
  groq-api-key:
    description: 'Groq API key.'
    required: false
    default: ''
  mistral-api-key:
    description: 'Mistral API key.'
    required: false
    default: ''
  openrouter-api-key:
    description: 'OpenRouter API key.'
    required: false
    default: ''
  xai-api-key:
    description: 'xAI / Grok API key.'
    required: false
    default: ''
  cerebras-api-key:
    description: 'Cerebras API key.'
    required: false
    default: ''
  deepseek-api-key:
    description: 'DeepSeek API key.'
    required: false
    default: ''
  pi-autoresearch-ref:
    description: 'GitHub URL or git ref for the pi-autoresearch extension to install.'
    required: false
    default: 'https://github.com/davebcn87/pi-autoresearch'
  git-user-name:
    description: 'Git author name for autoresearch commits.'
    required: false
    default: 'autoresearch-bot'
  git-user-email:
    description: 'Git author email for autoresearch commits.'
    required: false
    default: 'autoresearch-bot@users.noreply.github.com'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pi-coding-agent
      shell: bash
      run: |
        set -e
        npm install -g @mariozechner/pi-coding-agent
        pi --version

    - name: Install ollama (provider=ollama)
      if: inputs.pi-provider == 'ollama'
      shell: bash
      run: |
        set -e
        curl -fsSL https://ollama.com/install.sh | sh
        ollama --version

    - name: Export provider keys
      shell: bash
      env:
        OLLAMA_KEY: ${{ inputs.ollama-api-key }}
        ANTHROPIC_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_KEY: ${{ inputs.openai-api-key }}
        GOOGLE_KEY: ${{ inputs.google-api-key }}
        GROQ_KEY: ${{ inputs.groq-api-key }}
        MISTRAL_KEY: ${{ inputs.mistral-api-key }}
        OPENROUTER_KEY: ${{ inputs.openrouter-api-key }}
        XAI_KEY: ${{ inputs.xai-api-key }}
        CEREBRAS_KEY: ${{ inputs.cerebras-api-key }}
        DEEPSEEK_KEY: ${{ inputs.deepseek-api-key }}
      run: |
        set -e
        # Forward every non-empty key under its provider's standard env-var
        # name. Pi only reads the one matching --provider; the rest are
        # ignored. We don't validate "provider X needs key Y" here — let pi
        # surface that error itself, since the supported provider list grows.
        emit() { local var="$1" val="$2"; if [ -n "$val" ]; then echo "$var=$val" >> "$GITHUB_ENV"; fi; }
        emit OLLAMA_API_KEY     "$OLLAMA_KEY"
        emit ANTHROPIC_API_KEY  "$ANTHROPIC_KEY"
        emit OPENAI_API_KEY     "$OPENAI_KEY"
        emit GOOGLE_API_KEY     "$GOOGLE_KEY"
        emit GROQ_API_KEY       "$GROQ_KEY"
        emit MISTRAL_API_KEY    "$MISTRAL_KEY"
        emit OPENROUTER_API_KEY "$OPENROUTER_KEY"
        emit XAI_API_KEY        "$XAI_KEY"
        emit CEREBRAS_API_KEY   "$CEREBRAS_KEY"
        emit DEEPSEEK_API_KEY   "$DEEPSEEK_KEY"

    - name: Install pi-autoresearch extension
      shell: bash
      env:
        PI_AUTORESEARCH_REF: ${{ inputs.pi-autoresearch-ref }}
      run: |
        set -e
        pi install "$PI_AUTORESEARCH_REF"
        echo "Installed pi-autoresearch extension."

    - name: Install RPC driver + helper scripts
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -e
        mkdir -p "$HOME/.pi-autoresearch/scripts"
        cp "$ACTION_PATH/scripts/"*.py "$HOME/.pi-autoresearch/scripts/"
        chmod +x "$HOME/.pi-autoresearch/scripts/"*.py
        echo "Installed scripts at $HOME/.pi-autoresearch/scripts/:"
        ls "$HOME/.pi-autoresearch/scripts/"

    - name: Configure git
      shell: bash
      env:
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -e
        git config --global user.name "$GIT_USER_NAME"
        git config --global user.email "$GIT_USER_EMAIL"
        git config --global init.defaultBranch main
