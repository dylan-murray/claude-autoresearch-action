name: 'Pi autoresearch — setup'
description: 'Install pi-coding-agent, the pi-autoresearch extension, ollama (if requested), and the RPC driver. Used as a step in pi-autoresearch.yml.'
author: 'Dylan Murray'
branding:
  icon: 'rotate-ccw'
  color: 'purple'

inputs:
  pi-provider:
    description: 'Pi provider id (e.g. `ollama`, `anthropic`, `openai`). Determines which secret pi expects in env.'
    required: true
  pi-model:
    description: 'Pi model id (e.g. `gpt-oss:120b-cloud`, `anthropic/claude-sonnet-4-6`).'
    required: true
  ollama-api-key:
    description: 'Ollama Cloud API key. Required iff `pi-provider` is `ollama`.'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key. Required iff `pi-provider` is `anthropic`.'
    required: false
    default: ''
  openai-api-key:
    description: 'OpenAI API key. Required iff `pi-provider` is `openai`.'
    required: false
    default: ''
  pi-autoresearch-ref:
    description: 'GitHub URL or git ref for the pi-autoresearch extension to install.'
    required: false
    default: 'https://github.com/davebcn87/pi-autoresearch'
  git-user-name:
    description: 'Git author name for autoresearch commits.'
    required: false
    default: 'autoresearch-bot'
  git-user-email:
    description: 'Git author email for autoresearch commits.'
    required: false
    default: 'autoresearch-bot@users.noreply.github.com'

runs:
  using: composite
  steps:
    - name: Verify provider credentials
      shell: bash
      env:
        PROVIDER: ${{ inputs.pi-provider }}
        OLLAMA_KEY: ${{ inputs.ollama-api-key }}
        ANTHROPIC_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_KEY: ${{ inputs.openai-api-key }}
      run: |
        set -e
        case "$PROVIDER" in
          ollama)
            [ -n "$OLLAMA_KEY" ] || { echo "::error::pi-provider=ollama requires ollama-api-key"; exit 1; }
            ;;
          anthropic)
            [ -n "$ANTHROPIC_KEY" ] || { echo "::error::pi-provider=anthropic requires anthropic-api-key"; exit 1; }
            ;;
          openai)
            [ -n "$OPENAI_KEY" ] || { echo "::error::pi-provider=openai requires openai-api-key"; exit 1; }
            ;;
          *)
            echo "::error::Unsupported pi-provider: $PROVIDER (supported: ollama, anthropic, openai)"
            exit 1
            ;;
        esac
        echo "provider=$PROVIDER ok"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pi-coding-agent
      shell: bash
      run: |
        set -e
        npm install -g @mariozechner/pi-coding-agent
        pi --version

    - name: Install ollama (provider=ollama)
      if: inputs.pi-provider == 'ollama'
      shell: bash
      env:
        OLLAMA_API_KEY: ${{ inputs.ollama-api-key }}
      run: |
        set -e
        curl -fsSL https://ollama.com/install.sh | sh
        ollama --version
        # Make the key available to subsequent steps without re-passing
        echo "OLLAMA_API_KEY=$OLLAMA_API_KEY" >> "$GITHUB_ENV"

    - name: Export provider keys to subsequent steps
      shell: bash
      env:
        ANTHROPIC_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_KEY: ${{ inputs.openai-api-key }}
      run: |
        set -e
        if [ -n "$ANTHROPIC_KEY" ]; then echo "ANTHROPIC_API_KEY=$ANTHROPIC_KEY" >> "$GITHUB_ENV"; fi
        if [ -n "$OPENAI_KEY" ]; then echo "OPENAI_API_KEY=$OPENAI_KEY" >> "$GITHUB_ENV"; fi

    - name: Install pi-autoresearch extension
      shell: bash
      env:
        PI_AUTORESEARCH_REF: ${{ inputs.pi-autoresearch-ref }}
      run: |
        set -e
        pi install "$PI_AUTORESEARCH_REF"
        echo "Installed pi-autoresearch extension."

    - name: Install RPC driver + helper scripts
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -e
        mkdir -p "$HOME/.pi-autoresearch/scripts"
        cp "$ACTION_PATH/scripts/"*.py "$HOME/.pi-autoresearch/scripts/"
        chmod +x "$HOME/.pi-autoresearch/scripts/"*.py
        echo "Installed scripts at $HOME/.pi-autoresearch/scripts/:"
        ls "$HOME/.pi-autoresearch/scripts/"

    - name: Configure git
      shell: bash
      env:
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -e
        git config --global user.name "$GIT_USER_NAME"
        git config --global user.email "$GIT_USER_EMAIL"
        git config --global init.defaultBranch main
